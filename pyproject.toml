[build-system]
requires = ["setuptools>=77"] # 77 is the first to accept an SPDX string in [project] license
build-backend = "setuptools.build_meta"

[project]
name = "rogue-eval"
version = "0.1.0"
description = "ROGUE corrigibility evaluation using the original OSWorld desktop harness"
readme = "README.md"
license = "MIT"
authors = [{ name = "ishanzenon", email = "ishanzenon0183@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "inspect_ai>=0.3.262",
    "inspect-evals-utils[huggingface]==0.3.0",
]

[project.urls]
Repository = "https://github.com/ishanzenon/rogue-eval"
Issues = "https://github.com/ishanzenon/rogue-eval/issues"

# Registers the package so `inspect eval rogue_eval/<task>` finds its tasks.
[project.entry-points.inspect_ai]
rogue_eval = "rogue_eval"

[dependency-groups]
dev = [
    "anthropic>=2.0", # with openai, the SDKs behind the `--model` commands in the READMEs
    "basedpyright>=1.40",
    "inspect-evals-lint==0.13.0",
    "openai>=3.4",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-asyncio",
    "pytest-dotenv",
    "pytest-inspect-evals[huggingface]==0.4.0",
    "pytest-mock",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rogue_eval*"] # examples/ stays out of the wheel

[tool.setuptools.package-data]
"*" = ["eval.yaml", "*.yaml", "*.json", "variants/*.json", "UPSTREAM-LICENSE"]

# Layout preset: multi-eval (tests/<package>/, src/<package>/README.md) or
# single-eval (flat tests/, README at the root). A hybrid repo keeps a preset and
# sets tests_layout or readme_location here on top of it.
[tool.inspect-evals-lint]
preset = "multi-eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-rA --durations=10 --color=yes"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_level = "WARNING"
env_files = [".env"]
# Test gates and markers come from pytest-inspect-evals. Dataset-download tests
# run by default; set RUN_DATASET_DOWNLOAD_TESTS=0 to skip them.
inspect_evals_dataset_download = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
exclude = [".venv", "build", "src/rogue_eval/_upstream.py"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"
# *.md: ruff formats Python blocks in Markdown, and the README generator writes them its own way.
extend-exclude = ["*.md", "src/rogue_eval/_upstream.py"]

[tool.ruff.lint]
preview = true
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "unspecified-encoding", # explicit text encoding, required by the eval checks
]
ignore = [
    "line-too-long",   # line-too-long: the formatter owns line length
    "D10",    # missing docstrings
    "missing-terminal-punctuation",   # first-line punctuation
    "single-line-implicit-string-concatenation", # single-line implicit concat conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests,examples}/**" = ["D", "magic-value-comparison", "unused-async"] # async mocks implement async protocols
