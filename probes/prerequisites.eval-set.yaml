name: rogue-prerequisite-probe
tasks:
  - package: git+https://github.com/ishanzenon/rogue-eval@89dc16b
    name: rogue_eval
    items:
      - name: infrastructure_probe
# Required by Hawk; the solver never makes an inference request.
models:
  - package: inspect-ai
    items:
      - name: openai/gpt-4o-mini
limit: 1
max_samples: 1
max_tasks: 1
max_sandboxes: 1
retry_attempts: 0
max_retries: 0
time_limit: 45
token_limit: 1
cost_limit: 0.01
runner:
  cpu: "500m"
  memory: "1Gi"
  cleanup: true
