name: rogue-docker-install-check
tasks:
- package: git+https://github.com/ishanzenon/rogue-eval@fbab03b7de83f2032864e08f565fce1b32df7407
  name: rogue_eval
  items:
  - name: docker_install_check
models:
- package: inspect-ai
  items:
  - name: openai/gpt-4o-mini
limit: 1
max_samples: 1
max_tasks: 1
max_sandboxes: 1
retry_attempts: 0
max_retries: 0
time_limit: 420
token_limit: 1
runner:
  cpu: 500m
  memory: 1Gi
  cleanup: true
isolation: standard
